  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; display:flex; flex-direction:column; min-height:100svh; }

  .wordmark .mi { font-weight:300; }
  .rule { width:3rem; height:3px; background:var(--primary-alt); border-radius:2px; margin:1.75rem 0; }

  .status { display:inline-block; align-self:flex-start; background:var(--surface); border:1px solid var(--divider); border-radius:999px; padding:0.45rem 0.95rem; font-size:0.9375rem; line-height:1.3; color:var(--muted); margin-bottom:2.5rem; }

  .contact a { font-size:1.125rem; color:var(--primary); text-decoration:none; border-bottom:1px solid rgba(30,90,62,0.35); padding-bottom:1px; word-break:break-word; }
  .contact a:hover, .contact a:focus-visible { border-bottom-color:var(--primary); }
  .contact a:focus-visible { outline:2px solid var(--primary-alt); outline-offset:3px; border-radius:2px; }
  footer { flex-shrink:0; border-top:1px solid var(--divider); padding:1.25rem 0; }
  footer p { max-width:34rem; margin:0 auto; padding:0 1.5rem; font-size:0.875rem; color:var(--muted); }

name: CI — suites de DB (nightly)

# Las 16 suites que pegan contra la base DEV COMPARTIDA (RLS, animal, maneuvers,
# reports, custom, scrotal, user_private, import, sync_streams, operaciones_rodeo,
# sigsa, treatments, audit, health, puesta-en-servicio, edge).
#
# POR QUÉ NO VAN EN ci.yml (cada push): escriben en DEV. Sumar un tercer escritor
# concurrente a las dos terminales que ya trabajan ahí reproduce el flake conocido
# de rate-limit de auth de Supabase y deja fixtures dando vueltas. Nightly a las
# 04:30 AR nadie más está tocando la base.
#
# Detectan lo que ci.yml no puede: DRIFT entre las migraciones aplicadas al remoto
# y lo que el código asume. Ese desfasaje hoy solo se ve cuando alguien corre el
# check completo a mano.

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC ≈ 04:30 AR (offset del backup de PROD, 06:00 UTC)
  workflow_dispatch: {}

# Una sola corrida de este workflow a la vez. Sin esto, un `Run workflow` manual mientras corre el nightly
# programado vuelve a poner dos escritores sobre la misma base DEV — el problema que `needs:` resuelve
# ADENTRO de la corrida, pero no ENTRE corridas.
concurrency:
  group: ci-db
  cancel-in-progress: false

jobs:
  # La suite E2E de Playwright (~45 min, 306 tests). Vive acá y no en `ci.yml` por el tiempo, y sobre todo
  # porque siembra datos reales vía los helpers admin → necesita los mismos secrets que las suites de DB.
  #
  # POR QUÉ SE ENGANCHA AHORA (2026-08-09): estuvo fuera de CI mientras tenía rojos —un badge rojo
  # permanente enseña a ignorar el badge—. Los rojos eran 19, y 19 de 19 quedaron cerrados hoy: 14 de dos
  # causas de fixture y 5 de un modo de falla sistémico (un elemento OCULTO con el mismo texto le ganaba al
  # `.first()`). Con la suite en verde, dejarla afuera solo garantiza que se vuelva a pudrir.
  #
  # Y hay una razón operativa: correrla a mano NO es viable. En la máquina de Raf los procesos largos en
  # background se mueren (se llevó puesto a Metro y a tres corridas), y en foreground no entra en el límite
  # de 10 min por comando. Acá 45 minutos no le molestan a nadie.
  e2e:
    # ⚠️ EN SERIE con db-suites, NUNCA en paralelo. Los dos siembran contra la MISMA base DEV, y dos
    # escritores concurrentes reproducen el flake de rate-limit de auth de Supabase — el mismo que ya
    # conocemos de tener dos terminales trabajando a la vez. Medido: la corrida #1 con `db-suites` sola dio
    # verde en 19m41s; la #2, con `e2e` en paralelo, la mató en 50s.
    #
    # El orden es db-suites → e2e y no al revés a propósito: el job barato primero, así un problema de DB se
    # ve en 20 minutos en vez de después de 50 de Playwright.
    needs: db-suites
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      # El build web que sirve el webServer de playwright.config (dist/). Sin esto el config avisa y el
      # webServer muere por timeout — falla clara, pero tarde.
      - name: Build web
        working-directory: app
        run: pnpm run e2e:build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.POWERSYNC_URL_DEV }}

      - name: Playwright
        working-directory: app
        run: pnpm exec playwright test --reporter=line
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.POWERSYNC_URL_DEV }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}

      # Solo ante rojo: el reporte con trazas es lo que convierte "falló" en "falló acá y así se veía".
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  db-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Historial completo: run-tests.mjs corre también los unit tests del cliente, y
      # `today-iso-guard.test.ts` deriva su oráculo con `git show <baseline>:<archivo>`.
      # Con el clone shallow por defecto ese commit no existe y el guard falla (fail-closed).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fail-fast ANTES de instalar nada. Sin estos secrets, run-tests.mjs saltea
      # las suites de DB con un warning y termina en VERDE — un nightly que no
      # corrió nada pero informa éxito es peor que no tenerlo. Acá se cae con
      # instrucciones en vez de mentir.
      - name: Verificar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_REF; do
            [ -z "${!v}" ] && missing="$missing ${v}_DEV"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets del repo:$missing"
            echo "Cargalos en Settings > Secrets and variables > Actions."
            echo "Los valores son los de .env.local (proyecto DEV, NUNCA los de PROD)."
            exit 1
          fi
          echo "Secrets presentes."

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Las suites leen tanto SUPABASE_* como EXPO_PUBLIC_SUPABASE_* según el archivo.
      # U9_DEPLOYED queda SIN setear a propósito: gatea asserts de comportamiento de
      # Edge Functions que todavía no están deployadas (se saltean, es lo correcto).
      - name: Suites de DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/run-tests.mjs
